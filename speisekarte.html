<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Signora – Speisekarte</title>
<style>
:root {
  --cream:#fef7ed;
  --ink:#171717;
  --muted:#817366;
  --green:#168447;
  --red:#c9322d;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--cream);
}
body{
  overflow:hidden;
  font-family:Georgia,"Times New Roman",serif;
}
.screen{
  min-height:100svh;
  position:relative;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:var(--cream);
}
.food{
  position:absolute;
  z-index:0;
  pointer-events:none;
  user-select:none;
  display:block;
}
.tomatoes{
  top:-2vh;
  right:-17vw;
  width:min(79vw,470px);
  height:auto;
  object-fit:cover;
  /* fade the inner/visible edge into the exact cream page color */
  -webkit-mask-image:radial-gradient(circle at 100% 0%, #000 0 57%, rgba(0,0,0,.98) 64%, rgba(0,0,0,.72) 73%, transparent 88%);
          mask-image:radial-gradient(circle at 100% 0%, #000 0 57%, rgba(0,0,0,.98) 64%, rgba(0,0,0,.72) 73%, transparent 88%);
}
.pasta{
  left:-21vw;
  bottom:-8vh;
  width:min(82vw,485px);
  height:auto;
  object-fit:cover;
  -webkit-mask-image:radial-gradient(circle at 0% 100%, #000 0 58%, rgba(0,0,0,.98) 65%, rgba(0,0,0,.74) 74%, transparent 89%);
          mask-image:radial-gradient(circle at 0% 100%, #000 0 58%, rgba(0,0,0,.98) 65%, rgba(0,0,0,.74) 74%, transparent 89%);
}
.card{
  position:relative;
  z-index:2;
  width:min(88vw,520px);
  text-align:center;
  padding:40px 24px;
  transform:translateY(-1.5vh);
}
.eyebrow{
  font:600 11px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:.31em;
  text-transform:uppercase;
  color:#8a7867;
  margin-bottom:14px;
}
.name{
  margin:0;
  color:var(--ink);
  font-family:"Brush Script MT","Segoe Script","Snell Roundhand",cursive;
  font-size:clamp(54px,13vw,92px);
  line-height:.92;
  font-weight:500;
  letter-spacing:-.035em;
}
.tricolore{
  width:120px;
  height:6px;
  margin:18px auto 21px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  overflow:hidden;
  border-radius:999px;
  box-shadow:0 1px 8px rgba(0,0,0,.08);
}
.tricolore span:nth-child(1){background:var(--green)}
.tricolore span:nth-child(2){background:#fff}
.tricolore span:nth-child(3){background:var(--red)}
.menu{
  margin:0 0 24px;
  color:#2a2621;
  font-size:clamp(27px,7vw,42px);
  font-weight:400;
  line-height:1;
}
.loading-text{
  margin-bottom:15px;
  color:var(--muted);
  font:500 11px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:.24em;
  text-transform:uppercase;
}
.spinner{
  width:44px;
  height:44px;
  margin:0 auto 20px;
  border-radius:50%;
  background:conic-gradient(var(--red) 0 33%, #eee6db 33% 66%, var(--green) 66% 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0);
          mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0);
  animation:spin 1s linear infinite;
}
.sub{
  color:#8f806f;
  font:italic 14px/1.4 Georgia,"Times New Roman",serif;
}
.skip{
  margin-top:18px;
  border:0;
  background:transparent;
  color:#796d61;
  text-decoration:underline;
  font:500 12px system-ui,sans-serif;
  padding:7px 10px;
  cursor:pointer;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:700px){
  .tomatoes{right:-95px;top:-35px;width:470px}
  .pasta{left:-120px;bottom:-70px;width:485px}
}
@media(prefers-reduced-motion:reduce){
  .spinner{animation-duration:1.6s}
}
</style>
</head>
